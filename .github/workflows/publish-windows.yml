name: Publish verified Windows installer

on:
  workflow_dispatch:
    inputs:
      runId:
        description: Successful main Windows build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.runId }}
    steps:
      - name: Validate source build and download verified installer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID must be numeric.'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg repository "$GH_REPO" '
            .name == "Build Windows desktop app" and
            .path == ".github/workflows/windows-desktop.yml" and
            .head_branch == "main" and
            .head_repository.full_name == $repository and
            .status == "completed" and .conclusion == "success"
          ' source-run.json
          source_sha=$(jq -r '.head_sha' source-run.json)
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid build commit.'; exit 1; }
          echo "SOURCE_HEAD_SHA=$source_sha" >> "$GITHUB_ENV"
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name SeatChart-Windows-x64 --dir artifact
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('artifact/SeatChart-Setup.exe')
          assert installer.stat().st_size > 20 * 1024 * 1024, 'Installer payload missing'
          with installer.open('rb') as file:
              assert file.read(2) == b'MZ', 'Not a Windows executable'
          PY
          (cd artifact && sha256sum SeatChart-Setup.exe > SHA256SUMS.txt)
      - name: Publish installer and checksum to prepared release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.0 --repo "$GH_REPO" --json isDraft >/dev/null
          gh release upload v1.0.0 artifact/SeatChart-Setup.exe artifact/SHA256SUMS.txt --repo "$GH_REPO" --clobber
          gh release edit v1.0.0 --repo "$GH_REPO" --target "$SOURCE_HEAD_SHA" --draft=false --latest
